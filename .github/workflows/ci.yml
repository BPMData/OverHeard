name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # --legacy-peer-deps: the template's vite/esbuild peer ranges conflict under npm's strict resolver
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Prettier check
        run: npx prettier --check .

      - name: Unit and UI tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Node 22 production syntax check
        run: NODE_ENV=production node --check server.ts

      - name: Server smoke test
        # Run through bash so it works even if the file loses its executable bit
        run: bash scripts/smoke.sh

  e2e:
    name: Chromium browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
