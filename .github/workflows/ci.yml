name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prettier check
        run: npx prettier --check .

      - name: Verify lint, tests, build, and server smoke test
        run: npm run verify

  e2e:
    name: Chromium browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Phone screenshots for review
        if: ${{ !cancelled() }}
        run: PHONE_SHOTS=1 npx playwright test e2e/phone.spec.ts --reporter=list
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: phone-screenshots
          path: phone-screenshots/
          if-no-files-found: ignore
