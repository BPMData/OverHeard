name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy over-heard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Unit and UI tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Node 22 production syntax check
        run: NODE_ENV=production node --check server.ts

      - name: Server smoke test
        run: bash scripts/smoke.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Clear AI Studio source annotations before first GitHub deploy
        run: |
          gcloud run services describe over-heard --region us-east1 --project loyal-rookery-403218 --format export > /tmp/service.yaml
          if [ "$(yq '.metadata.labels["managed-by"] // ""' /tmp/service.yaml)" != "github-actions" ]; then
            echo "Inspecting pre-migration annotations and containers:"
            yq '.spec.template.metadata.annotations' /tmp/service.yaml
            yq '.spec.template.spec.containers[].name' /tmp/service.yaml
            if yq -e '.spec.template.metadata.annotations["run.googleapis.com/sources"] != null or .spec.template.metadata.annotations["run.googleapis.com/base-images"] != null' /tmp/service.yaml >/dev/null 2>&1; then
              yq -i 'del(.spec.template.metadata.annotations["run.googleapis.com/sources"], .spec.template.metadata.annotations["run.googleapis.com/base-images"], .spec.template.metadata.name)' /tmp/service.yaml
              yq -i 'if (.spec.template.spec.containers | length) == 1 then .spec.template.spec.containers[0].name = "over-heard" else . end' /tmp/service.yaml
              gcloud run services replace /tmp/service.yaml --region us-east1 --project loyal-rookery-403218
            fi
          fi

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: over-heard
          region: us-east1
          project_id: loyal-rookery-403218
          source: .
          flags: '--allow-unauthenticated --port=3000 --max-instances=1'
