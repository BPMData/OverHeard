name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    # Docs-only pushes (TODO.md, ROOMS.md, ...) don't redeploy: a deploy restarts the server and
    # ends every live room. Run the workflow by hand (workflow_dispatch) if one ever must.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Verify and deploy over-heard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify lint, tests, build, and server smoke test
        run: npm run verify

      - name: Production browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/606573080592/locations/global/workloadIdentityPools/github/providers/overheard
          service_account: github-deployer@loyal-rookery-403218.iam.gserviceaccount.com

      - name: Verify Cloud Run source upload
        run: bash scripts/check-upload.sh

      - name: Record previous Cloud Run revision
        id: previous
        run: |
          rev=$(gcloud run services describe over-heard \
            --region us-east1 \
            --project loyal-rookery-403218 \
            --format='value(status.latestReadyRevisionName)' || true)
          echo "revision=${rev}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy over-heard \
            --source . \
            --region us-east1 \
            --project loyal-rookery-403218 \
            --allow-unauthenticated \
            --port 3000 \
            --max-instances 1 \
            --concurrency 1000 \
            --timeout 3600 \
            --command "" \
            --args "" \
            --update-labels "managed-by=github-actions,commit-sha=${GITHUB_SHA}" \
            --quiet

      - name: Verify serving revision and live endpoints
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PREVIOUS_REVISION: ${{ steps.previous.outputs.revision }}
        run: node scripts/check-deploy.mjs
