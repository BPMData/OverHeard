name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    # Docs-only pushes (TODO.md, ROOMS.md, ...) don't redeploy: a deploy restarts the server and
    # ends every live room. Run the workflow by hand (workflow_dispatch) if one ever must.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy over-heard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Unit and UI tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Node 22 production syntax check
        run: NODE_ENV=production node --check server.ts

      - name: Server smoke test
        run: bash scripts/smoke.sh

      - name: Production browser upgrade test
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- e2e/upgrade.spec.ts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Verify Cloud Run source upload
        run: bash scripts/check-upload.sh

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy over-heard \
            --source . \
            --region us-east1 \
            --project loyal-rookery-403218 \
            --allow-unauthenticated \
            --port 3000 \
            --max-instances 1 \
            --concurrency 1000 \
            --timeout 3600 \
            --command "" \
            --args "" \
            --update-labels "managed-by=github-actions,commit-sha=${GITHUB_SHA}" \
            --quiet
